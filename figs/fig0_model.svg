<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="2200" height="1200" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif"><rect width="1100" height="600" fill="#fff"/><text x="550" y="34" font-size="21" text-anchor="middle" fill="#1d1d1f" font-weight="700">ZGA を動かすレトロトランスポゾンの「下剋上」モデル（マウスとラット）</text><rect x="110" y="58" width="650" height="38" rx="8" fill="#eceae4"/><text x="435.0" y="83" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="600">ZGA の本体（TE に頼らない遺伝子のスイッチ）＝ 両種で保存（ほかの 4 種でも共通の傾向）</text><line x1="110" y1="112" x2="110" y2="470" stroke="#1d1d1f" stroke-width="1.5"/><line x1="110" y1="470" x2="770" y2="470" stroke="#1d1d1f" stroke-width="1.5"/><text x="40" y="295.0" font-size="17" text-anchor="middle" fill="#1d1d1f" font-weight="700" transform="rotate(-90 40 295.0)">2 細胞期での働きの強さ（相対）</text><text x="110" y="496" font-size="14" text-anchor="middle" fill="#666" font-weight="400">共通祖先</text><text x="760" y="496" font-size="14" text-anchor="middle" fill="#666" font-weight="400">現在</text><text x="435.0" y="522" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="400">時間 →</text><line x1="300" y1="112" x2="300" y2="470" stroke="#d9d9d4" stroke-width="2" stroke-dasharray="6 5"/><text x="300" y="496" font-size="14" text-anchor="middle" fill="#666" font-weight="400">マウスとラットの分岐</text><line x1="110" y1="410" x2="760" y2="410" stroke="#d6336c" stroke-width="2" stroke-dasharray="8 6"/><text x="118" y="432" font-size="13" text-anchor="start" fill="#d6336c" font-weight="400">閾値（これより下は働かない）</text><path d="M120,150 C200,165 260,195 300,215" fill="none" stroke="#9a6b4f" stroke-width="4" stroke-linecap="round" stroke-dasharray=""/><path d="M300,215 C420,235 600,262 760,278" fill="none" stroke="#9a6b4f" stroke-width="4" stroke-linecap="round" stroke-dasharray=""/><path d="M300,215 C420,240 510,290 560,330 C620,378 700,428 760,438" fill="none" stroke="#9a6b4f" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 6"/><text x="124" y="140" font-size="14" text-anchor="start" fill="#9a6b4f" font-weight="700">古参：古い ERVL（MT2B など）</text><path d="M330,440 C400,380 480,330 560,330 C640,330 700,372 760,392" fill="none" stroke="#e8743b" stroke-width="3.2" stroke-linecap="round" stroke-dasharray=""/><path d="M560,330 C620,300 660,150 760,128" fill="none" stroke="#2563c9" stroke-width="5" stroke-linecap="round" stroke-dasharray=""/><circle cx="560" cy="330" r="11" fill="#fff" stroke="#2563c9" stroke-width="3"/><text x="560" y="335" font-size="13" text-anchor="middle" fill="#2563c9" font-weight="400">★</text><path d="M330,445 C420,370 500,345 560,348 C640,352 700,362 760,366" fill="none" stroke="#19a974" stroke-width="3.2" stroke-linecap="round" stroke-dasharray=""/><text x="772" y="133" font-size="14" text-anchor="start" fill="#2563c9" font-weight="700">マウス：MERVL（MT2_Mm）</text><text x="772" y="151" font-size="12.5" text-anchor="start" fill="#666" font-weight="400">今の主役（2 細胞期の読みの 92%）</text><text x="772" y="283" font-size="14" text-anchor="start" fill="#9a6b4f" font-weight="700">ラット：古参が主役のまま</text><text x="772" y="301" font-size="12.5" text-anchor="start" fill="#666" font-weight="400">（読みの 71%）</text><text x="772" y="371" font-size="14" text-anchor="start" fill="#19a974" font-weight="700">ラット：MT2_Rat（小さな波、9%）</text><text x="772" y="400" font-size="14" text-anchor="start" fill="#e8743b" font-weight="700">マウス：MT2C_Mm</text><text x="772" y="418" font-size="12.5" text-anchor="start" fill="#666" font-weight="400">（DUX 結合なし、衰えた）</text><text x="772" y="445" font-size="14" text-anchor="start" fill="#9a6b4f" font-weight="700">マウス：古参は退く（5%）</text><g id="gekokujo-note"><rect x="345" y="104" width="300" height="112" rx="6" fill="#fff" stroke="#2563c9" stroke-width="1.5"/><text x="357" y="127" font-size="17" text-anchor="start" fill="#2563c9" font-weight="800">★ 下剋上（マウス）</text><text x="357" y="152" font-size="11.5" text-anchor="start" fill="#1d1d1f" font-weight="400">MT2C_Mm が DUX 結合能を獲得して MERVL に</text><text x="357" y="174" font-size="11.5" text-anchor="start" fill="#1d1d1f" font-weight="400">→ DUX の結合で転写が活性化され、</text><text x="357" y="196" font-size="11.5" text-anchor="start" fill="#1d1d1f" font-weight="400">　 コピー数が増加したと考えられる</text><line x1="500" y1="216" x2="552" y2="318" stroke="#2563c9" stroke-width="1.2" stroke-dasharray="3 3"/></g><g id="decline-note"><text x="120" y="300" font-size="13" text-anchor="start" fill="#9a6b4f" font-weight="600">両種に共通：ほぼ中立な変異がたまり衰える</text><text x="120" y="318" font-size="12.5" text-anchor="start" fill="#666" font-weight="400">（寿命 ≈ 種が分かれるまでの時間）</text><text x="120" y="352" font-size="13" text-anchor="start" fill="#9a6b4f" font-weight="700">マウスの古参だけが黙った理由（候補）：</text><text x="120" y="370" font-size="12.5" text-anchor="start" fill="#9a6b4f" font-weight="400">古参の転写を促進する因子（Nr5a2・Klf5 など）が</text><text x="120" y="388" font-size="12.5" text-anchor="start" fill="#9a6b4f" font-weight="400">マウスで少ないと考えられる</text><line x1="410" y1="372" x2="468" y2="272" stroke="#9a6b4f" stroke-width="1.2" stroke-dasharray="3 3"/></g><text x="200" y="535" font-size="1" text-anchor="start" fill="#1d1d1f" font-weight="400"></text><text x="550" y="572" font-size="12.5" text-anchor="middle" fill="#666" font-weight="400">模式図。実測値は右端の割合（2 細胞期の LTR の読みに占める割合）だけで、線の形・高さの途中・交わる時期は描いたイメージ。</text><text x="550" y="590" font-size="12.5" text-anchor="middle" fill="#666" font-weight="400">マウスの古参の衰えとMERVL の増加のどちらが先かは決まっていないので、★で同時に入れ替わるように描いた。</text></svg>